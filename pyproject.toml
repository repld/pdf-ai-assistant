[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-assistant"
version = "0.1.0"
description = "A document question-answering application with grounded responses and source citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pypdf[fonts]>=5,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
web = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]
ui = [
    "streamlit>=1.40,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
